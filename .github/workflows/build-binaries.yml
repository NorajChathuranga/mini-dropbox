name: Build Desktop Binaries

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: droplink-linux
            executable_path: dist/app
          - os: windows-latest
            artifact_name: droplink-windows
            executable_path: dist/app.exe
          - os: macos-latest
            artifact_name: droplink-macos
            executable_path: dist/app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0

      - name: Sanity checks before build
        run: |
          python -m py_compile app.py
          python -c "import app; print('Import check: OK')"

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --clean --noconfirm app.spec

      - name: Verify build output exists
        shell: bash
        run: |
          test -f "${{ matrix.executable_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.executable_path }}
          if-no-files-found: error
