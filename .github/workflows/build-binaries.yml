name: Build Desktop Binaries

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: droplink-linux
            executable_path: dist/app
          - os: windows-latest
            artifact_name: droplink-windows
            executable_path: dist/app.exe
          - os: macos-latest
            artifact_name: droplink-macos
            executable_path: dist/app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0

      - name: Sanity checks before build
        run: |
          python -m py_compile app.py
          python -c "import app; print('Import check: OK')"

      - name: Build binary with PyInstaller
        run: |
          pyinstaller --clean --noconfirm app.spec

      - name: Verify build output exists
        shell: bash
        run: |
          test -f "${{ matrix.executable_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.executable_path }}
          if-no-files-found: error

  release:
    # Only run on pushes to main/master — skip for PRs
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create releases and upload assets

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/            # Each artifact lands in dist/<artifact_name>/

      - name: Rename binaries to include platform suffix
        run: |
          mv dist/droplink-linux/app       ./droplink-linux
          mv dist/droplink-windows/app.exe ./droplink-windows.exe
          mv dist/droplink-macos/app       ./droplink-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Droplink Build v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          overwrite: true
          files: |
            ./droplink-linux
            ./droplink-windows.exe
            ./droplink-macos